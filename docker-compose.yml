services:
  influxdb:
    image: influxdb:1.8-alpine
    networks:
      - spotisights
    restart: unless-stopped
    env_file: config/influxdb.env
    volumes:
      - ./volumes/influxdb:/var/lib/influxdb:rw,delegated
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/ping > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "backup.enable=true"
  
  grafana:
    image: grafana/grafana:8.4.1
    networks:
      - proxy
      - spotisights
    restart: unless-stopped
    hostname: mashb1t-spotisights-grafana
    container_name: mashb1t-spotisights-grafana
    env_file: config/grafana.env
    depends_on:
      - influxdb
      - redis
    volumes:
      - ./volumes/grafana:/var/lib/grafana:rw,delegated
      - ./grafana/provisioning/:/etc/grafana/provisioning/
      - ./grafana/dashboards/:/var/lib/grafana/dashboards/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spotisights-stats.rule=Host(`spotisights-stats.mashb1t.de`)"
      - "traefik.http.routers.spotisights-stats.entrypoints=websecure"
      - "traefik.http.routers.spotisights-stats.tls.certresolver=letsencrypt"
      - "traefik.http.services.spotisights-stats.loadbalancer.server.port=3000"
      - "traefik.http.routers.spotisights-stats.middlewares=cloudflare-ips@file"
      - 'kuma.__web="https://spotisights-stats.mashb1t.de", "spotisights"'
      - "backup.enable=true"
      - "backup.db.type=sqlite"
      - "backup.db.path=/var/lib/grafana/grafana.db"
  
  mysql:
    restart: unless-stopped
    image: mysql/mysql-server:8.0
    networks:
      - spotisights
    env_file: config/mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "backup.enable=true"

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - spotisights
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  
  php:
    build: ./php
    restart: unless-stopped
    hostname: mashb1t-spotisights-php
    container_name: mashb1t-spotisights-php
    depends_on:
      - influxdb
      - mysql
      - redis
    env_file:
      - config/mysql.env
      - config/php.env
      - config/influxdb.env
    #  ports:
    #    - '8080:80'
    #    - '8443:443'
    volumes:
      - ./volumes/php/sessions:/app/sessions:rw,cached
    networks:
      - proxy
      - spotisights
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spotisights.rule=Host(`spotisights.mashb1t.de`)"
      - "traefik.http.routers.spotisights.entrypoints=websecure"
      - "traefik.http.routers.spotisights.tls.certresolver=letsencrypt"
      - "traefik.http.services.spotisights.loadbalancer.server.port=80"
      - "traefik.http.routers.spotisights.middlewares=cloudflare-ips@file"
      - 'kuma.__web="https://spotisights.mashb1t.de", "spotisights"'
      - "backup.enable=true"
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - PHP_DISPLAY_ERRORS=0
      - PHP_DEBUGGER=none
      - PHP_MEMORY_LIMIT=2048M
  #      - PHP_MAX_EXECUTION_TIME=-1
  #      - XDEBUG_MODE=debug
  #      - XDEBUG_START_WITH_REQUEST=yes
  #      - XDEBUG_CLIENT_PORT=9000
  #      - XDEBUG_CLIENT_HOST=docker.local
  #      - XDEBUG_MAX_NESTING_LEVEL=1000

volumes:
  mysql_data:

networks:
  proxy:
    name: proxy
    external: true
  spotisights:

